<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 단어</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --kakao:#FEE500;--kakao-dark:#3C1E1E;--bg:#F5F5F5;--white:#FFF;
      --green:#6AAA64;--yellow:#E8B931;--gray:#B0B3B8;--gray-dark:#787C7E;
      --border:#D9D9D9;--shadow:0 2px 8px rgba(0,0,0,.08);
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--kakao-dark);min-height:100dvh;display:flex;flex-direction:column;touch-action:manipulation;overflow:hidden}
    header{background:var(--kakao);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:10}
    header h1{font-size:18px;font-weight:700}
    .header-btns{display:flex;gap:8px}
    .icon-btn{width:36px;height:36px;border:none;border-radius:50%;background:rgba(60,30,30,.1);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 8px 6px;max-width:360px;margin:0 auto;width:100%;min-height:0;overflow:hidden}
    .info{text-align:center;font-size:12px;color:#666;margin-bottom:10px;line-height:1.4}
    .shared-bar{width:100%;max-width:360px;margin:0 auto 10px;padding:10px 12px;background:#fff;border-radius:16px;box-shadow:var(--shadow);font-size:13px;color:#333;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .shared-bar .label{font-weight:700}
    .shared-bar .btn-secondary{width:auto;padding:8px 12px;min-width:100px}
    .board{flex:1 1 auto;display:grid;grid-template-rows:repeat(6,1fr);gap:3px;margin:0 auto 10px;width:260px;max-width:100%;min-height:0;max-height:240px}
    .row{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%}
    .cell{aspect-ratio:1;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;background:var(--white);transition:transform .15s,border-color .2s,background .2s,color .2s}
    .cell.filled{border-color:#999}
    .cell.flip{animation:flip .5s ease}
    @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
    .cell.correct{background:var(--green);border-color:var(--green);color:#fff}
    .cell.present{background:var(--yellow);border-color:var(--yellow);color:#fff}
    .cell.absent{background:var(--gray);border-color:var(--gray);color:#fff}
    .cell.current{border-color:var(--kakao-dark)}
    .message{min-height:24px;font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;color:#c0392b}
    .message.congrats{background:linear-gradient(135deg,#ffe066,#ff8a65);color:#7f1d1d;padding:12px 16px;border-radius:16px;box-shadow:0 18px 36px rgba(255,138,101,.24);border:1px solid rgba(255,255,255,.8);display:inline-flex;align-items:center;justify-content:center;min-height:auto;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.12);}
    .keyboard{width:100%;max-width:360px;margin:0 auto;padding:10px 10px 14px;background:var(--white);border-top:1px solid var(--border);flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
    .kb-row{display:flex;justify-content:center;gap:5px;margin-bottom:6px;min-width:0}
    .key{min-width:0;flex:1 1 0;max-width:44px;height:42px;border:none;border-radius:10px;background:#E8E8E8;font-size:15px;font-weight:700;color:var(--kakao-dark);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 10px rgba(0,0,0,.08);transition:transform .15s,background .2s}
    .key.wide{flex:1.5;max-width:68px;font-size:13px}
    .key.enter{flex:2;max-width:80px;background:var(--kakao);font-size:13px;color:#3C1E1E}
    .key.back{flex:1.4;max-width:70px;font-size:17px}
    .key.correct{background:var(--green);color:#fff}
    .key.present{background:var(--yellow);color:#fff}
    .key.absent{background:var(--gray-dark);color:#fff}
    .key:active{transform:scale(.95)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
  .modal input[type="text"]{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:16px}
  .modal .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
    @media(max-width:520px){
      .board{width:220px;max-width:100%;max-height:200px;gap:2px;}
      .row{gap:2px}
      .keyboard{max-width:100%;flex:0 0 auto;padding:10px 10px 12px;}
      .cell{font-size:13px}
      .key{max-width:44px;height:42px;font-size:15px}
      .key.enter{max-width:76px}
      .key.back{max-width:64px}
    }
    .modal-overlay.show{display:flex}
    .modal{background:var(--white);border-radius:16px;padding:24px 20px;max-width:360px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
    .modal h2{font-size:20px;margin-bottom:16px;text-align:center}
    .modal-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:#666}
    .modal-wrap{position:relative}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;text-align:center}
    .stat-num{font-size:28px;font-weight:700}
    .stat-label{font-size:11px;color:#666;margin-top:4px}
    .dist{margin-bottom:16px}
    .dist-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px}
    .dist-bar{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
    .dist-fill{height:100%;background:var(--kakao-dark);border-radius:4px;min-width:8px;transition:width .3s}
    .btn-primary{width:100%;padding:14px;border:none;border-radius:10px;background:var(--kakao);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
    .btn-secondary{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--white);font-size:14px;cursor:pointer;margin-top:8px}
    .result-emoji{font-family:monospace;font-size:20px;letter-spacing:2px;text-align:center;margin:12px 0}
    .help-list{font-size:14px;line-height:1.8;padding-left:18px}
    .help-demo{display:flex;gap:4px;margin:8px 0 16px}
    .help-cell{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:2px solid var(--border)}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(60,30,30,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
    .toast.show{opacity:1}
    @media(max-width:360px){.key{height:40px;font-size:13px}.cell{font-size:16px}}
  </style>
</head>

<script>
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const BASIC_VOWELS=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
const JUNG_SPLIT={ㅐ:['ㅏ','ㅣ'],ㅒ:['ㅑ','ㅣ'],ㅔ:['ㅓ','ㅣ'],ㅖ:['ㅕ','ㅣ'],ㅘ:['ㅗ','ㅏ'],ㅙ:['ㅗ','ㅏ','ㅣ'],ㅚ:['ㅗ','ㅣ'],ㅝ:['ㅜ','ㅓ'],ㅞ:['ㅜ','ㅓ','ㅣ'],ㅟ:['ㅜ','ㅣ'],ㅢ:['ㅡ','ㅣ']};
const CHO_SPLIT={ㄲ:['ㄱ','ㄱ'],ㄸ:['ㄷ','ㄷ'],ㅃ:['ㅂ','ㅂ'],ㅆ:['ㅅ','ㅅ'],ㅉ:['ㅈ','ㅈ']};
const JONG_SPLIT={ㄳ:['ㄱ','ㅅ'],ㄵ:['ㄴ','ㅈ'],ㄶ:['ㄴ','ㅎ'],ㄺ:['ㄹ','ㄱ'],ㄻ:['ㄹ','ㅁ'],ㄼ:['ㄹ','ㅂ'],ㄽ:['ㄹ','ㅅ'],ㄾ:['ㄹ','ㅌ'],ㄿ:['ㄹ','ㅍ'],ㅀ:['ㄹ','ㅎ'],ㅄ:['ㅂ','ㅅ']};
const CHO_MERGE=[
  {seq:['ㄱ','ㄱ'],cho:'ㄲ'},{seq:['ㄷ','ㄷ'],cho:'ㄸ'},{seq:['ㅂ','ㅂ'],cho:'ㅃ'},{seq:['ㅅ','ㅅ'],cho:'ㅆ'},{seq:['ㅈ','ㅈ'],cho:'ㅉ'}
];
const JUNG_MERGE=[
  {seq:['ㅗ','ㅏ','ㅣ'],jung:'ㅙ'},{seq:['ㅜ','ㅓ','ㅣ'],jung:'ㅞ'},
  {seq:['ㅗ','ㅏ'],jung:'ㅘ'},{seq:['ㅗ','ㅣ'],jung:'ㅚ'},{seq:['ㅜ','ㅓ'],jung:'ㅝ'},{seq:['ㅜ','ㅣ'],jung:'ㅟ'},
  {seq:['ㅡ','ㅣ'],jung:'ㅢ'},{seq:['ㅑ','ㅣ'],jung:'ㅒ'},{seq:['ㅕ','ㅣ'],jung:'ㅖ'},
  {seq:['ㅏ','ㅣ'],jung:'ㅐ'},{seq:['ㅓ','ㅣ'],jung:'ㅔ'},
  ...BASIC_VOWELS.map(v=>({seq:[v],jung:v}))
];
const JONG_MERGE=[
  {seq:['ㄱ','ㅅ'],jong:'ㄳ'},{seq:['ㄴ','ㅈ'],jong:'ㄵ'},{seq:['ㄴ','ㅎ'],jong:'ㄶ'},
  {seq:['ㄹ','ㄱ'],jong:'ㄺ'},{seq:['ㄹ','ㅁ'],jong:'ㄻ'},{seq:['ㄹ','ㅂ'],jong:'ㄼ'},
  {seq:['ㄹ','ㅅ'],jong:'ㄽ'},{seq:['ㄹ','ㅌ'],jong:'ㄾ'},{seq:['ㄹ','ㅍ'],jong:'ㄿ'},
  {seq:['ㄹ','ㅎ'],jong:'ㅀ'},{seq:['ㅂ','ㅅ'],jong:'ㅄ'},
  ...JONG.filter(Boolean).map(j=>({seq:JONG_SPLIT[j]||[j],jong:j}))
];
JUNG_MERGE.sort((a,b)=>b.seq.length-a.seq.length);
JONG_MERGE.sort((a,b)=>b.seq.length-a.seq.length);
const JAMO_SET=new Set([...CHO,...BASIC_VOWELS]);
function startsWith(arr,seq){return seq.every((v,i)=>arr[i]===v);}
const ROWS=6,COLS=5;
const STATS_KEY='kakaoWordleStats';
const SHARED_DB_PATH='/sharedWord';
const SHARED_CURRENT_ID='currentId';
const SHARED_ENTRIES='entries';
const FIREBASE_CONFIG={
  apiKey: "AIzaSyAJyIuxDvR6LVVu5unNsZ76jAdxz49YpME",
  authDomain: "todaywordle-aebdd.firebaseapp.com",
  databaseURL: "https://todaywordle-aebdd-default-rtdb.firebaseio.com",
  projectId: "todaywordle-aebdd",

  messagingSenderId: "87999445641",

};
let firebaseReady=false;
let firebaseDb=null;
let currentSharedInfo=null;

function setCookie(name,value,days=365){
  const d=new Date();d.setTime(d.getTime()+days*24*60*60*1000);
  document.cookie=`${encodeURIComponent(name)}=${encodeURIComponent(value)};path=/;expires=${d.toUTCString()}`;
}
function getCookie(name){
  return document.cookie.split('; ').reduce((acc,cookie)=>{
    const [k,v]=cookie.split('=');return k===encodeURIComponent(name)?decodeURIComponent(v):acc;
  },'');
}
function loadPlayerName(){
  return getCookie('playerName')||localStorage.getItem('playerName')||'';
}
function savePlayerName(name){
  if(!name) return;
  setCookie('playerName',name,365);
  localStorage.setItem('playerName',name);
  updatePlayerLabel(name);
}
function updatePlayerLabel(name){
  const label=document.getElementById('playerLabel');
  const btn=document.getElementById('btnSetName');
  const current=name||loadPlayerName();
  label.textContent='플레이어';
  btn.textContent=current?current:'이름 설정';
}
function formatTime(iso){
  if(!iso) return '';
  const d=new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function buildSharedEntry(word){
  return {word,solved:false,solvedBy:'',solvedAt:'',updatedAt:new Date().toISOString()};
}

function showSharedInfo(data){
  // 이제 상단 설명은 표시하지 않습니다.

async function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('YOUR_')) return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDb=firebase.database();
    firebaseReady=true;
  }catch(e){
    console.warn('Firebase 초기화 실패',e);
  }
}

function getCurrentSharedEntry(root){
  const currentId=root?.[SHARED_CURRENT_ID];
  return currentId ? root?.[SHARED_ENTRIES]?.[currentId] : null;
}

async function syncSharedWord(forceNew=false){
  if(!firebaseReady){
    answer=pickRandomAnswer();
    answerJamos=decompose(answer);
    showSharedInfo(null);
    return;
  }
  const rootRef=firebaseDb.ref(SHARED_DB_PATH);
  try{
    const snapshot=await rootRef.once('value');
    let root=snapshot.val();
    let currentId=root?.[SHARED_CURRENT_ID];
    let currentEntry=currentId ? root?.[SHARED_ENTRIES]?.[currentId] : null;

    //const currentId=root?.[SHARED_CURRENT_ID];
    currentEntry=getCurrentSharedEntry(root);
    if(!currentEntry || currentEntry.solved || forceNew){
      const nextKey=firebaseDb.ref(`${SHARED_DB_PATH}/${SHARED_ENTRIES}`).push().key;
      const nextWord=pickRandomAnswer();
      const newEntry=buildSharedEntry(nextWord);
      const transactionResult=await rootRef.transaction(current=>{
        const curEntry=getCurrentSharedEntry(current);
        if(curEntry && !curEntry.solved && !forceNew) return current;
        return {
          ...current,
          [SHARED_CURRENT_ID]:nextKey,
          [SHARED_ENTRIES]:{...(current?.[SHARED_ENTRIES]||{}), [nextKey]:newEntry}
        };
      });
      root=transactionResult.snapshot.val();
      currentId=root?.[SHARED_CURRENT_ID];
      currentEntry=getCurrentSharedEntry(root);
    }
    if(currentEntry){
      currentSharedInfo={id:currentId,...currentEntry};
      answer=currentEntry.word;
      answerJamos=decompose(answer);
      showSharedInfo(currentEntry);
    }
  }catch(e){
    console.warn('Firebase 동기화 실패',e);
    answer=pickRandomAnswer();
    answerJamos=decompose(answer);
    showSharedInfo(null);
  }
}

async function createNextSharedEntry(){
  if(!firebaseReady) return;
  const rootRef=firebaseDb.ref(SHARED_DB_PATH);
  const nextKey=firebaseDb.ref(`${SHARED_DB_PATH}/${SHARED_ENTRIES}`).push().key;
  const nextWord=pickRandomAnswer();
  const newEntry=buildSharedEntry(nextWord);
  try{
    await rootRef.transaction(current=>{
      const curCurrentId=current?.[SHARED_CURRENT_ID];
      const curEntry=curCurrentId ? current?.[SHARED_ENTRIES]?.[curCurrentId] : null;
      if(curEntry && !curEntry.solved) return current;
      return {
        ...current,
        [SHARED_CURRENT_ID]:nextKey,
        [SHARED_ENTRIES]:{...(current?.[SHARED_ENTRIES]||{}), [nextKey]:newEntry}
      };
    });
  }catch(e){
    console.warn('새 공유 문제 생성 실패',e);
  }
}

async function claimSharedWord(){
  if(!firebaseReady||!answer) return {committed:false, firstSolverName:''};
  const name=loadPlayerName()||'익명';
  const rootRef=firebaseDb.ref(SHARED_DB_PATH);
  try{
    const nextKey=firebaseDb.ref(`${SHARED_DB_PATH}/${SHARED_ENTRIES}`).push().key;
    const nextWord=pickRandomAnswer();
    const newEntry=buildSharedEntry(nextWord);
    const result=await rootRef.transaction(current=>{
      if(!current) return;
      const currentId=current[SHARED_CURRENT_ID];
      const entry=current?.[SHARED_ENTRIES]?.[currentId];
      if(!entry||entry.solved||entry.word!==answer) return;
      return {
        ...current,
        [SHARED_CURRENT_ID]:nextKey,
        [SHARED_ENTRIES]:{
          ...current[SHARED_ENTRIES],
          [currentId]:{
            ...entry,
            solved:true,
            solvedBy:name,
            solvedAt:new Date().toISOString(),
            updatedAt:new Date().toISOString()
          },
          [nextKey]:newEntry
        }
      };
    });
    const committed=!!result.committed;
    const root=result.snapshot.val();
    // determine who solved the entry with this word (if any)
    let solvedByName='';
    if(root && root[SHARED_ENTRIES]){
      const entries=root[SHARED_ENTRIES];
      for(const k of Object.keys(entries)){
        const e=entries[k];
        if(e && e.word===answer && e.solved){ solvedByName=e.solvedBy||''; break; }
      }
    }
    firstSolverName=solvedByName;
    isFirstSolver = committed && solvedByName===name;
    if(committed){
      showToast('첫 정답자 기록이 서버에 저장되었습니다! 다음 문제가 등록되었습니다.');
      const currentId=root?.[SHARED_CURRENT_ID];
      const entry=root?.[SHARED_ENTRIES]?.[currentId];
      if(entry) showSharedInfo(entry);
    }
    return {committed, firstSolverName: solvedByName};
  }catch(e){
    console.warn('공유 정답 기록 실패',e);
    return {committed:false, firstSolverName:''};
  }
}

async function setupSharedListener(){

  const ref=firebaseDb.ref(SHARED_DB_PATH);
  ref.on('value',snapshot=>{
    const data=snapshot.val();

    if(!entry) return;
    if(currentSharedInfo && entry.word===currentSharedInfo.word && entry.solved===currentSharedInfo.solved) return;

function splitCho(c){return CHO_SPLIT[c]||[c];}
function splitJung(j){return JUNG_SPLIT[j]||[j];}
function splitJong(j){return j?JONG_SPLIT[j]||[j]:[];}

function decompose(text){
  const jamos=[];
  for(const ch of text.trim()){
    const c=ch.charCodeAt(0);
    if(c>=0xAC00&&c<=0xD7A3){
      const i=c-0xAC00,cho=Math.floor(i/588),jung=Math.floor((i%588)/28),jong=i%28;
      jamos.push(...splitCho(CHO[cho]),...splitJung(JUNG[jung]));
      if(jong) jamos.push(...splitJong(JONG[jong]));
    }else if(JAMO_SET.has(ch)){
      jamos.push(...splitCho(ch));
    }
  }
  return jamos;
}

function makeSyllable(cho,jung,jong=''){
  const ci=CHO.indexOf(cho),ji=JUNG.indexOf(jung),ki=JONG.indexOf(jong);
  if(ci<0||ji<0||ki<0) return null;
  return String.fromCharCode(0xAC00+ci*588+ji*28+ki);
}

function compose(jamos){
  function helper(rest,acc){
    if(!rest.length) return acc;
    const choCandidates=[];
    if(CHO.includes(rest[0])) choCandidates.push({cho:rest[0],len:1});
    for(const cm of CHO_MERGE){
      if(startsWith(rest,cm.seq)) choCandidates.push({cho:cm.cho,len:cm.seq.length});
    }
    if(!choCandidates.length) return null;
    for(const {cho, len:choLen} of choCandidates){
      const tail=rest.slice(choLen);
      for(const jm of JUNG_MERGE){
        if(!startsWith(tail,jm.seq)) continue;
        const afterJung=choLen+jm.seq.length;
        const s2=makeSyllable(cho,jm.jung);
        if(s2){const next=helper(rest.slice(afterJung),acc+s2);if(next!==null) return next;}
        for(const jgm of JONG_MERGE){
          if(!startsWith(rest.slice(afterJung),jgm.seq)) continue;
          const s3=makeSyllable(cho,jm.jung,jgm.jong);
          if(s3){const next=helper(rest.slice(afterJung+jgm.seq.length),acc+s3);if(next!==null) return next;}
        }
      }
    }
    return null;
  }
  return helper(jamos,'')??'';
}

function isFiveCellWord(word){
  const jamos=decompose(word);
  return jamos.length===COLS && compose(jamos)===word;
}

function parseWords(text){
  return [...new Set(text.split(/\r?\n/).map(w=>w.trim()).filter(w=>w&&/^[\uAC00-\uD7A3]+$/.test(w)&&isFiveCellWord(w)))];
}

function getDailyIndex(len){
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  let x=seed;
  for(let i=0;i<5;i++) x=(x*9301+49297)%233280;
  return Math.floor((x/233280)*len);
}

function evaluate(guessJamos,answerJamos){
  const res=Array(COLS).fill('absent');
  const remain=[...answerJamos];
  for(let i=0;i<COLS;i++){
    if(guessJamos[i]===answerJamos[i]){res[i]='correct';remain[i]=null;}
  }
  for(let i=0;i<COLS;i++){
    if(res[i]==='correct')continue;
    const idx=remain.indexOf(guessJamos[i]);
    if(idx>=0){res[i]='present';remain[idx]=null;}
  }
  return res;
}

function buildShareText(includeTitle=true, opts={}){
  // opts: can be boolean (isFirst) or object {isFirst, firstName, isShared}
  let isFirst=false, firstName='';
  if(typeof opts==='boolean') isFirst=opts;
  else { isFirst=!!opts.isFirst; firstName=opts.firstName||''; }
  const won=results.length&&results[results.length-1].every(r=>r==='correct');
  const emoji={correct:'🟩',present:'🟨',absent:'⬜'};
  const lines=results.map(r=>r.map(s=>emoji[s]).join(''));
  const d=new Date();
  const date=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  let text='';
  if(isFirst){
    text += 'WINNER\n';
  } else {
    // for non-first shared solvers, we'll not include the date/title line when firstName is provided
    if(!firstName && includeTitle) text += `오늘의 단어 ${date}\n`;
  }
  text += won?`${results.length}/6\n`:`X/6\n`;
  text += lines.join('\n');
  if(!isFirst && firstName){
    text += `\n\n먼저 맞춘 사람: ${firstName}`;
  }
  const url = location.href;
  text += `\n\n${url}`;
  return text;
}

function parseISO(iso){ try{ return new Date(iso); }catch(e){ return null; } }

function periodStart(kind){
  const now=new Date();
  if(kind==='day'){
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }else if(kind==='week'){
    const d=new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const day=d.getDay(); // 0 Sun - 6 Sat
    const diff = (day + 6) % 7; // make Monday=0
    d.setDate(d.getDate()-diff);
    d.setHours(0,0,0,0);
    return d;
  }else if(kind==='month'){
    return new Date(now.getFullYear(), now.getMonth(), 1);
  }
  return new Date(0);
}

    const data = snap.val()||{};
    const start = periodStart(kind);
    const counts = {};
    const firstTimes = {};
    Object.values(data).forEach(e=>{
      if(!e||!e.solved||!e.solvedAt||!e.solvedBy) return;
      const t = parseISO(e.solvedAt);
      if(!t||t<start) return;
      const name = e.solvedBy || '익명';
      counts[name] = (counts[name]||0) + 1;
      if(!firstTimes[name] || t < firstTimes[name]) firstTimes[name]=t;
    });
    const arr = Object.keys(counts).map(name=>({name,count:counts[name],first:firstTimes[name]}));
    arr.sort((a,b)=>{ if(b.count!==a.count) return b.count-a.count; return (a.first||0)-(b.first||0); });
    if(!arr.length){ container.innerHTML='기록이 없습니다.'; return; }
    container.innerHTML = arr.slice(0,5).map((it,idx)=>`<div style="display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--border)"><div><strong>${idx+1}.</strong> ${it.name}</div><div>${it.count}회</div></div>`).join('');
  }catch(e){ console.warn(e); container.innerHTML='불러오기 실패'; }
}

function resetBoard(){
  row=0;currentJamos=[];gameOver=false;results=[];
  document.querySelectorAll('.cell').forEach(c=>{c.textContent='';c.className='cell';});
  messageEl.textContent='';
  messageEl.classList.remove('congrats');
}

function randomIndex(len){
  if(len<=1) return 0;
  const now = Date.now();
  const perf = typeof performance !== 'undefined' && performance.now ? performance.now() : 0;
  const timeFactor = ((now % 1000) + (perf % 1)) / 1000;
  const cryptoRand = (typeof crypto !== 'undefined' && crypto.getRandomValues)
    ? crypto.getRandomValues(new Uint32Array(1))[0] / 0x100000000
    : Math.random();
  const extraRand = Math.random();
  const seed = (cryptoRand + timeFactor + extraRand) % 1;
  return Math.floor(seed * len);
}

function pickRandomAnswer(){
  if(words.length===1) return words[0];
  let next;
  do{next=words[randomIndex(words.length)];}while(next===answer);
  return next;
}

function startNewGame(random=true){
  if((!gameOver&&(row>0||currentJamos.length>0))&&!confirm('진행 중인 게임을 포기하고 새 게임을 시작할까요?')) return;
  buildKeyboard();
  resetBoard();
  gameMode=random?'random':'daily';
  answer=random?pickRandomAnswer():words[getDailyIndex(words.length)];
  answerJamos=decompose(answer);
  localStorage.removeItem('kakaoWordleToday');
  updateCurrentRow();
  document.getElementById('resultModal').classList.remove('show');
  showToast(random?'새 단어로 시작!':'오늘의 단어로 시작!');
}

async function startSharedGame(forceNew=false){
  if((!gameOver&&(row>0||currentJamos.length>0))&&!confirm('진행 중인 게임을 포기하고 현재 공유 문제로 시작할까요?')) return;
  await syncSharedWord(forceNew);
  buildKeyboard();
  resetBoard();
  gameMode='shared';
  answerJamos=decompose(answer);
  localStorage.removeItem('kakaoWordleToday');
  updateCurrentRow();
  document.getElementById('resultModal').classList.remove('show');
  showToast('공유된 문제로 시작합니다!');
}

document.addEventListener('keydown',e=>{

  else if(e.key==='Backspace')onKey('Backspace');
  else if(JAMO_SET.has(e.key))onKey(e.key);
});

async function init(){
  buildBoard();buildKeyboard();
  updatePlayerLabel();
  await initFirebase();
  words=await loadAnswerWords();
  guessWords=await loadGuessWords();
  if(!words.length){messageEl.textContent='단어 목록을 불러올 수 없습니다.';return;}
  await syncSharedWord();
  if(firebaseReady && currentSharedInfo) gameMode='shared';
  await setupSharedListener();
  const saved=localStorage.getItem('kakaoWordleToday');
  const today=new Date().toDateString();
  if(saved){
    try{
      const data=JSON.parse(saved);
      if(data.date===today&&data.answer===answer){
        gameMode=data.gameMode||'shared';
        row=data.row;results=data.results||[];gameOver=data.gameOver;
        const keyStates={};
        data.board.forEach((jamos,r)=>{
          jamos.forEach((j,c)=>{
            const cell=document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
            cell.textContent=j;
            const state=data.states[r][c];
            if(state) cell.classList.add(state);
            if(j&&state){
              const rank={absent:1,present:2,correct:3};
              const oldRank=keyStates[j]?rank[keyStates[j]]:0;
              if(rank[state]>oldRank) keyStates[j]=state;
            }
          });
        });
        Object.entries(keyStates).forEach(([key,state])=>{
          if(keyEls[key]&&state){
            keyEls[key].classList.add(state);
          }
        });
        if(!gameOver) currentJamos=data.current||[];
        else {
          messageEl.textContent=data.won?'축하합니다!':'정답: '+answer;
          messageEl.classList.toggle('congrats', !!data.won);
        }
      }
    }catch(e){}
  }
  updateCurrentRow();
}

function saveProgress(){
  const today=new Date().toDateString();
  const board=[],states=[];
  for(let r=0;r<ROWS;r++){
    const j=[],s=[];
    for(let c=0;c<COLS;c++){
      const cell=document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      j.push(cell.textContent);
      s.push(cell.classList.contains('correct')?'correct':cell.classList.contains('present')?'present':cell.classList.contains('absent')?'absent':'');
    }
    board.push(j);states.push(s);
  }
  localStorage.setItem('kakaoWordleToday',JSON.stringify({
    date:today,answer,row,current:currentJamos,board,states,results,gameOver,gameMode,
    won:gameOver&&results.length&&results[results.length-1].every(x=>x==='correct')
  }));
}

init();
