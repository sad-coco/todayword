    body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--kakao-dark);min-height:100dvh;display:flex;flex-direction:column;touch-action:manipulation;overflow:hidden}
    header{background:var(--kakao);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:10}
    header h1{font-size:18px;font-weight:700}
    .header-btns{display:flex;gap:8px}
    .icon-btn{width:36px;height:36px;border:none;border-radius:50%;background:rgba(60,30,30,.1);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 8px 6px;max-width:360px;margin:0 auto;width:100%;min-height:0;overflow:hidden}
    .info{text-align:center;font-size:12px;color:#666;margin-bottom:10px;line-height:1.4}
    .board{flex:1 1 auto;display:grid;grid-template-rows:repeat(6,1fr);gap:3px;margin:0 auto 10px;width:260px;max-width:100%;min-height:0;max-height:240px}
    .row{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%}
    .cell{aspect-ratio:1;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;background:var(--white);transition:transform .15s,border-color .2s,background .2s,color .2s}
    .cell.filled{border-color:#999}
    .cell.flip{animation:flip .5s ease}
    @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
    .cell.correct{background:var(--green);border-color:var(--green);color:#fff}
    .cell.present{background:var(--yellow);border-color:var(--yellow);color:#fff}
    .cell.absent{background:var(--gray);border-color:var(--gray);color:#fff}
    .cell.current{border-color:var(--kakao-dark)}
    .message{min-height:24px;font-size:14px;font-weight:600;text-align:center;margin-bottom:8px;color:#c0392b}
    .keyboard{width:100%;max-width:360px;margin:0 auto;padding:8px 8px 12px;background:var(--white);border-top:1px solid var(--border);flex:0 0 180px;display:flex;flex-direction:column;justify-content:center}
    .kb-row{display:flex;justify-content:center;gap:4px;margin-bottom:5px}
    .key{min-width:0;flex:1;max-width:34px;height:44px;border:none;border-radius:6px;background:#E8E8E8;font-size:15px;font-weight:600;color:var(--kakao-dark);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
    .key.wide{flex:1.6;max-width:56px;font-size:12px}
    .key.enter{flex:2;max-width:72px;background:var(--kakao);font-size:13px}
    .key.back{flex:1.5;max-width:60px;font-size:18px}
    .key.correct{background:var(--green);color:#fff}
    .key.present{background:var(--yellow);color:#fff}
    .key.absent{background:var(--gray-dark);color:#fff}
    .key:active{transform:scale(.95)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
    @media(max-width:520px){
      .board{width:220px;max-width:100%;max-height:200px;gap:2px;}
      .row{gap:2px}
      .keyboard{max-width:100%;flex:0 0 240px;padding:10px 10px 12px;}
      .cell{font-size:13px}
      .key{max-width:34px;height:48px;font-size:15px}
      .key.enter{max-width:72px}
      .key.back{max-width:58px}

    .modal-wrap{position:relative}

const BASIC_VOWELS=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
const JUNG_SPLIT={ㅐ:['ㅏ','ㅣ'],ㅒ:['ㅑ','ㅣ'],ㅔ:['ㅓ','ㅣ'],ㅖ:['ㅕ','ㅣ'],ㅘ:['ㅗ','ㅏ'],ㅙ:['ㅗ','ㅏ','ㅣ'],ㅚ:['ㅗ','ㅣ'],ㅝ:['ㅜ','ㅓ'],ㅞ:['ㅜ','ㅓ','ㅣ'],ㅟ:['ㅜ','ㅣ'],ㅢ:['ㅡ','ㅣ']};
const CHO_SPLIT={ㄲ:['ㄱ','ㄱ'],ㄸ:['ㄷ','ㄷ'],ㅃ:['ㅂ','ㅂ'],ㅆ:['ㅅ','ㅅ'],ㅉ:['ㅈ','ㅈ']};
const JONG_SPLIT={ㄳ:['ㄱ','ㅅ'],ㄵ:['ㄴ','ㅈ'],ㄶ:['ㄴ','ㅎ'],ㄺ:['ㄹ','ㄱ'],ㄻ:['ㄹ','ㅁ'],ㄼ:['ㄹ','ㅂ'],ㄽ:['ㄹ','ㅅ'],ㄾ:['ㄹ','ㅌ'],ㄿ:['ㄹ','ㅍ'],ㅀ:['ㄹ','ㅎ'],ㅄ:['ㅂ','ㅅ']};
const CHO_MERGE=[
  {seq:['ㄱ','ㄱ'],cho:'ㄲ'},{seq:['ㄷ','ㄷ'],cho:'ㄸ'},{seq:['ㅂ','ㅂ'],cho:'ㅃ'},{seq:['ㅅ','ㅅ'],cho:'ㅆ'},{seq:['ㅈ','ㅈ'],cho:'ㅉ'}
];
const JUNG_MERGE=[
  {seq:['ㅗ','ㅏ','ㅣ'],jung:'ㅙ'},{seq:['ㅜ','ㅓ','ㅣ'],jung:'ㅞ'},

  {seq:['ㅡ','ㅣ'],jung:'ㅢ'},{seq:['ㅑ','ㅣ'],jung:'ㅒ'},{seq:['ㅕ','ㅣ'],jung:'ㅖ'},
  {seq:['ㅏ','ㅣ'],jung:'ㅐ'},{seq:['ㅓ','ㅣ'],jung:'ㅔ'},
  ...BASIC_VOWELS.map(v=>({seq:[v],jung:v}))
];
const JONG_MERGE=[
  {seq:['ㄱ','ㅅ'],jong:'ㄳ'},{seq:['ㄴ','ㅈ'],jong:'ㄵ'},{seq:['ㄴ','ㅎ'],jong:'ㄶ'},

  ...JONG.filter(Boolean).map(j=>({seq:JONG_SPLIT[j]||[j],jong:j}))

JUNG_MERGE.sort((a,b)=>b.seq.length-a.seq.length);

function splitCho(c){return CHO_SPLIT[c]||[c];}
function splitJung(j){return JUNG_SPLIT[j]||[j];}
function splitJong(j){return j?JONG_SPLIT[j]||[j]:[];}

function decompose(text){
  const jamos=[];
  for(const ch of text.trim()){
    const c=ch.charCodeAt(0);
    if(c>=0xAC00&&c<=0xD7A3){
      const i=c-0xAC00,cho=Math.floor(i/588),jung=Math.floor((i%588)/28),jong=i%28;
      jamos.push(...splitCho(CHO[cho]),...splitJung(JUNG[jung]));
      if(jong) jamos.push(...splitJong(JONG[jong]));
    }else if(JAMO_SET.has(ch)){
      jamos.push(...splitCho(ch));
    }
  }
  return jamos;
}

function makeSyllable(cho,jung,jong=''){
  const ci=CHO.indexOf(cho),ji=JUNG.indexOf(jung),ki=JONG.indexOf(jong);
  if(ci<0||ji<0||ki<0) return null;
  return String.fromCharCode(0xAC00+ci*588+ji*28+ki);
}

function compose(jamos){
  function helper(rest,acc){
    if(!rest.length) return acc;
    const choCandidates=[];
    if(CHO.includes(rest[0])) choCandidates.push({cho:rest[0],len:1});
    for(const cm of CHO_MERGE){
      if(startsWith(rest,cm.seq)) choCandidates.push({cho:cm.cho,len:cm.seq.length});
    }
    if(!choCandidates.length) return null;
    for(const {cho, len:choLen} of choCandidates){
      const tail=rest.slice(choLen);
      for(const jm of JUNG_MERGE){
        if(!startsWith(tail,jm.seq)) continue;
        const afterJung=choLen+jm.seq.length;
        const s2=makeSyllable(cho,jm.jung);
        if(s2){const next=helper(rest.slice(afterJung),acc+s2);if(next!==null) return next;}
        for(const jgm of JONG_MERGE){
          if(!startsWith(rest.slice(afterJung),jgm.seq)) continue;
          const s3=makeSyllable(cho,jm.jung,jgm.jong);
          if(s3){const next=helper(rest.slice(afterJung+jgm.seq.length),acc+s3);if(next!==null) return next;}
        }
      }
    }
    return null;
  }
  return helper(jamos,'')??'';
}

function isFiveCellWord(word){
  const jamos=decompose(word);
  return jamos.length===COLS && compose(jamos)===word;
}

function parseWords(text){
  return [...new Set(text.split(/\r?\n/).map(w=>w.trim()).filter(w=>w&&/^[\uAC00-\uD7A3]+$/.test(w)&&isFiveCellWord(w)))];
}

async function loadTextFile(path,fallback){
  try{const res=await fetch(path);if(res.ok)return await res.text();}catch(e){}
  return fallback;
}

async function loadAnswerWords(){
  return parseWords(await loadTextFile('words.txt',EMBEDDED_WORDS));
}

async function loadGuessWords(){
  const answer=await loadAnswerWords();
  const set=new Set(answer);
  if(typeof DICTIONARY_WORDS!=='undefined'){
    DICTIONARY_WORDS.forEach(w=>set.add(w));
  }else{
    const dict=parseWords(await loadTextFile('dictionary.txt',''));
    dict.forEach(w=>set.add(w));
    parseWords(await loadTextFile('guess-words.txt',EMBEDDED_GUESS)).forEach(w=>set.add(w));
  }
  return set;
}

function getDailyIndex(len){
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  let x=seed;
  for(let i=0;i<5;i++) x=(x*9301+49297)%233280;
  return Math.floor((x/233280)*len);
}

function evaluate(guessJamos,answerJamos){
  const res=Array(COLS).fill('absent');
  const remain=[...answerJamos];
  for(let i=0;i<COLS;i++){
    if(guessJamos[i]===answerJamos[i]){res[i]='correct';remain[i]=null;}
  }
  for(let i=0;i<COLS;i++){
    if(res[i]==='correct')continue;
    const idx=remain.indexOf(guessJamos[i]);
    if(idx>=0){res[i]='present';remain[idx]=null;}
  }
  return res;
}

function loadStats(){
  try{return JSON.parse(localStorage.getItem(STATS_KEY))||defaultStats();}catch(e){return defaultStats();}
}
function defaultStats(){return{played:0,won:0,streak:0,maxStreak:0,distribution:[0,0,0,0,0,0]};}
function saveStats(s){localStorage.setItem(STATS_KEY,JSON.stringify(s));}

let words=[],guessWords=new Set(),answer='',answerJamos=[],row=0,currentJamos=[],gameOver=false,results=[];
let keyEls={},gameMode='daily';

const boardEl=document.getElementById('board');
const messageEl=document.getElementById('message');
const keyboardEl=document.getElementById('keyboard');
const toastEl=document.getElementById('toast');

function showToast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'),1800);
}

function buildBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++){
    const rowEl=document.createElement('div');
    rowEl.className='row';
    rowEl.dataset.row=r;
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.row=r;cell.dataset.col=c;
      rowEl.appendChild(cell);
    }
    boardEl.appendChild(rowEl);
  }
}

function buildKeyboard(){
  keyEls={};
  const layout=[
    ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ'],
    ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
    ['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']
  ];
  keyboardEl.innerHTML='';
  layout.forEach(row=>{
    const rowEl=document.createElement('div');
    rowEl.className='kb-row';
    row.forEach(k=>{
      const btn=document.createElement('button');
      btn.className='key';btn.textContent=k;btn.dataset.key=k;
      btn.addEventListener('click',()=>onKey(k));
      keyEls[k]=btn;rowEl.appendChild(btn);
    });
    keyboardEl.appendChild(rowEl);
  });
  const bottom=document.createElement('div');
  bottom.className='kb-row';
  const back=document.createElement('button');
  back.className='key back';back.textContent='⌫';
  back.addEventListener('click',()=>onKey('Backspace'));
  const enter=document.createElement('button');
  enter.className='key enter';enter.textContent='확인';
  enter.addEventListener('click',()=>onKey('Enter'));
  bottom.append(back,enter);
  keyboardEl.appendChild(bottom);
}

function updateCurrentRow(){
  for(let c=0;c<COLS;c++){
    const cell=document.querySelector(`.cell[data-row="${row}"][data-col="${c}"]`);
    cell.textContent=currentJamos[c]||'';
    cell.classList.toggle('filled',!!currentJamos[c]);
    cell.classList.toggle('current',c===currentJamos.length&&row<ROWS);
  }
}

function onKey(key){
  if(gameOver)return;
  if(key==='Backspace'){
    if(currentJamos.length){currentJamos.pop();updateCurrentRow();messageEl.textContent='';}
    return;
  }
  if(key==='Enter'){submitGuess();return;}
  if(!JAMO_SET.has(key))return;
  const nextJamos=CHO_SPLIT[key] ? splitCho(key) : [key];
  if(currentJamos.length+nextJamos.length>COLS){showToast('5칸이 가득 찼어요');return;}
  currentJamos.push(...nextJamos);
  updateCurrentRow();
  messageEl.textContent='';
}

function isValidWord(word){
  if(!word||!/^[가-힣]+$/.test(word)) return false;
  if(decompose(word).length!==COLS) return false;
  return guessWords.has(word);
}

async function submitGuess(){
  if(gameOver) return;
  if(currentJamos.length!==COLS){showToast('5칸을 채워주세요');return;}
  const word=compose(currentJamos);
  if(!word){showToast('올바른 단어가 아니에요');shakeRow();return;}
  if(!isValidWord(word)){showToast('사전에 없는 단어예요');shakeRow();return;}
  const guessJamos=[...currentJamos];
  const evalRes=evaluate(guessJamos,answerJamos);
  results.push(evalRes.map(s=>s==='correct'?'correct':s==='present'?'present':'absent'));
  const cells=[];
  for(let c=0;c<COLS;c++){
    const cell=document.querySelector(`.cell[data-row="${row}"][data-col="${c}"]`);
    cells.push(cell);
    cell.classList.remove('current');
    setTimeout(()=>{
      cell.classList.add('flip',evalRes[c]);
      cell.classList.remove('filled');
      const k=guessJamos[c];
      if(keyEls[k]){
        const prev=keyEls[k].classList;
        const rank={absent:1,present:2,correct:3};
        const cur=evalRes[c];
        const old=prev.contains('correct')?'correct':prev.contains('present')?'present':prev.contains('absent')?'absent':'';
        const oldRank=old?rank[old]:0;
        if(rank[cur]>oldRank){keyEls[k].classList.remove('correct','present','absent');keyEls[k].classList.add(cur);}
      }
    },c*300);
  }
  const won=evalRes.every(s=>s==='correct');
  setTimeout(()=>{
    if(won) endGame(true);
    else if(row>=ROWS-1) endGame(false);
    else{row++;currentJamos=[];updateCurrentRow();}
    saveProgress();
  },COLS*300+200);
}

function shakeRow(){
  const rowEl=document.querySelector(`.row[data-row="${row}"]`);
  rowEl.style.animation='none';
  void rowEl.offsetWidth;
  rowEl.style.animation='shake .4s';
}

const shakeStyle=document.createElement('style');
shakeStyle.textContent='@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
document.head.appendChild(shakeStyle);

function endGame(won){
  gameOver=true;
  const stats=loadStats();
  stats.played++;
  if(won){stats.won++;stats.streak++;stats.maxStreak=Math.max(stats.maxStreak,stats.streak);stats.distribution[row]++;}
  else stats.streak=0;
  saveStats(stats);
  document.getElementById('resultTitle').textContent=won?'정답입니다! 🎉':'아쉬워요 😢';
  document.getElementById('resultWord').textContent=answer;
  document.getElementById('resultEmoji').textContent=buildShareText(won,false);
  document.getElementById('resultModal').classList.add('show');
  messageEl.textContent=won?'축하합니다!':'정답: '+answer;
}

function buildShareText(includeTitle=true){
  const won=results.length&&results[results.length-1].every(r=>r==='correct');
  const emoji={correct:'🟩',present:'🟨',absent:'⬜'};
  const lines=results.map(r=>r.map(s=>emoji[s]).join(''));
  const d=new Date();
  const date=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  let text='';
  if(includeTitle) text=`오늘의 단어 ${date}\n`;
  text+=won?`${results.length}/6\n`:`X/6\n`;
  text+=lines.join('\n');
  return text;
}

async function shareResult(){
  const text=buildShareText();
  if(navigator.share){
    try{await navigator.share({title:'오늘의 단어',text,url:location.href});return;}catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('결과가 복사되었어요!');
  }catch(e){
    showToast('복사에 실패했어요');
  }
}

function renderStats(){
  const s=loadStats();
  const pct=s.played?Math.round(s.played?s.won/s.played*100:0):0;
  document.getElementById('statsGrid').innerHTML=`
    <div><div class="stat-num">${s.played}</div><div class="stat-label">플레이</div></div>
    <div><div class="stat-num">${pct}</div><div class="stat-label">승률%</div></div>
    <div><div class="stat-num">${s.streak}</div><div class="stat-label">연속</div></div>
    <div><div class="stat-num">${s.maxStreak}</div><div class="stat-label">최대연속</div></div>`;
  const max=Math.max(...s.distribution,1);
  document.getElementById('distChart').innerHTML=s.distribution.map((n,i)=>`
    <div class="dist-row"><span>${i+1}</span><div class="dist-bar"><div class="dist-fill" style="width:${Math.max(n/max*100,8)}%"></div></div><span>${n}</span></div>`).join('');
}

function resetBoard(){
  row=0;currentJamos=[];gameOver=false;results=[];
  document.querySelectorAll('.cell').forEach(c=>{c.textContent='';c.className='cell';});
  messageEl.textContent='';
}

function randomIndex(len){
  if(len<=1) return 0;
  const now = Date.now();
  const perf = typeof performance !== 'undefined' && performance.now ? performance.now() : 0;
  const timeFactor = ((now % 1000) + (perf % 1)) / 1000;
  const cryptoRand = (typeof crypto !== 'undefined' && crypto.getRandomValues)
    ? crypto.getRandomValues(new Uint32Array(1))[0] / 0x100000000
    : Math.random();
  const extraRand = Math.random();
  const seed = (cryptoRand + timeFactor + extraRand) % 1;
  return Math.floor(seed * len);
}

function pickRandomAnswer(){
  if(words.length===1) return words[0];
  let next;
  do{next=words[randomIndex(words.length)];}while(next===answer);
  return next;
}

function startNewGame(random=true){
  if((!gameOver&&(row>0||currentJamos.length>0))&&!confirm('진행 중인 게임을 포기하고 새 게임을 시작할까요?')) return;
  buildKeyboard();
  resetBoard();
  gameMode=random?'random':'daily';
  answer=random?pickRandomAnswer():words[getDailyIndex(words.length)];
  answerJamos=decompose(answer);
  localStorage.removeItem('kakaoWordleToday');
  updateCurrentRow();
  document.getElementById('resultModal').classList.remove('show');
  showToast(random?'새 단어로 시작!':'오늘의 단어로 시작!');
}

document.getElementById('btnNew').addEventListener('click',()=>startNewGame(true));
document.getElementById('btnNewFromResult').addEventListener('click',()=>startNewGame(true));
document.getElementById('btnStats').addEventListener('click',()=>{renderStats();document.getElementById('statsModal').classList.add('show');});
document.getElementById('btnHelp').addEventListener('click',()=>document.getElementById('helpModal').classList.add('show'));
document.getElementById('btnShare').addEventListener('click',shareResult);
document.getElementById('btnShareResult').addEventListener('click',shareResult);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('.modal-overlay').classList.remove('show')));
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter')onKey('Enter');
  else if(e.key==='Backspace')onKey('Backspace');
  else if(JAMO_SET.has(e.key))onKey(e.key);
});

async function init(){
  buildBoard();buildKeyboard();
  words=await loadAnswerWords();
  guessWords=await loadGuessWords();
  if(!words.length){messageEl.textContent='단어 목록을 불러올 수 없습니다.';return;}
  gameMode='random';
  answer=pickRandomAnswer();
  answerJamos=decompose(answer);
  const saved=localStorage.getItem('kakaoWordleToday');
  const today=new Date().toDateString();
  if(saved){
    try{
      const data=JSON.parse(saved);
      if(data.date===today&&data.answer===answer){
        gameMode=data.gameMode||'daily';
        row=data.row;results=data.results||[];gameOver=data.gameOver;
        const keyStates={};
        data.board.forEach((jamos,r)=>{
          jamos.forEach((j,r2)=>{
            const cell=document.querySelector(`.cell[data-row="${r}"][data-col="${r2}"]`);
            cell.textContent=j;
            const state=data.states[r][r2];
            if(state) cell.classList.add(state);
            if(j&&state){
              const rank={absent:1,present:2,correct:3};
              const oldRank=keyStates[j]?rank[keyStates[j]]:0;
              if(rank[state]>oldRank) keyStates[j]=state;
            }
          });
        });
        Object.entries(keyStates).forEach(([key,state])=>{
          if(keyEls[key]&&state){
            keyEls[key].classList.add(state);
          }
        });
        if(!gameOver) currentJamos=data.current||[];
        else messageEl.textContent=data.won?'축하합니다!':'정답: '+answer;
      }
    }catch(e){}
  }
  updateCurrentRow();
}

function saveProgress(){
  const today=new Date().toDateString();
  const board=[],states=[];
  for(let r=0;r<ROWS;r++){
    const j=[],s=[];
    for(let c=0;c<COLS;c++){
      const cell=document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      j.push(cell.textContent);
      s.push(cell.classList.contains('correct')?'correct':cell.classList.contains('present')?'present':cell.classList.contains('absent')?'absent':'');
    }
    board.push(j);states.push(s);
  }
  localStorage.setItem('kakaoWordleToday',JSON.stringify({
    date:today,answer,row,current:currentJamos,board,states,results,gameOver,gameMode,
    won:gameOver&&results.length&&results[results.length-1].every(x=>x==='correct')
  }));
}

init();
</script>
